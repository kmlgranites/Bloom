<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/bloom-favicon.svg">
<title>Bloom · Functional Prototype</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">

<style>
  @font-face{font-family:"Proxima Soft";src:url("genz/fonts/proxima-nova-soft-regular.ttf") format("truetype");font-weight:400;font-display:swap}
  @font-face{font-family:"Proxima Soft";src:url("genz/fonts/proxima-nova-soft-medium.ttf") format("truetype");font-weight:500;font-display:swap}
  @font-face{font-family:"Proxima Soft";src:url("genz/fonts/proxima-nova-soft-semibold.ttf") format("truetype");font-weight:600;font-display:swap}
  @font-face{font-family:"Proxima Soft";src:url("genz/fonts/proxima-nova-soft-bold.ttf") format("truetype");font-weight:700;font-display:swap}
  @font-face{font-family:"Filson Soft";src:local("Nunito");font-weight:700}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;font-family:"Proxima Soft",system-ui,sans-serif}
  body{background:#EEF0EB;overflow:hidden;color:#022F36}
  button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;outline:none}

  /* Page enters disabled — was interfering with screenshot capture */
  .page-enter {}

  @keyframes sprPulse {
    0%, 100% { opacity:.35; transform:scale(.7); }
    50%      { opacity:1;   transform:scale(1);  }
  }
  @keyframes sprBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  @keyframes sprRipple {
    0%   { transform: scale(0.85); opacity: 0.6; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  @keyframes sprFadeUp {
    from { opacity:0; transform: translateY(8px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(2,47,54,0.15); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(2,47,54,0.25); }

  /* Outer stage */
  .stage {
    position: fixed; inset: 0; padding: 0;
    display: flex; background: #EEF0EB;
  }
  .stage > * {
    margin: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="genz/sprout-shared.jsx"></script>
<script type="text/babel" src="proto/proto-shell.jsx"></script>
<script type="text/babel" src="proto/proto-pages.jsx"></script>
<script type="text/babel" src="proto/proto-review.jsx"></script>
<script type="text/babel" src="proto/proto-settings.jsx"></script>
<script type="text/babel" src="proto/proto-auth.jsx"></script>
<script type="text/babel" src="proto/proto-onboarding.jsx"></script>

<script type="text/babel" data-presets="env,react">
const {
  StoreProvider, useStore, PFrame, PShell,
  PageHome, PageJobs, PageApplications, PageCopilot,
  PageReview, PageSubmitted, PageSettings, PageLogin, ProtoOnboarding,
} = window;

function Router() {
  const { s } = useStore();

  // Login — full-frame, no sidebar
  if (s.route === "login") {
    return (
      <PFrame url="bloom.app/login">
        <div className="page-enter" style={{flex:1, display:"flex", flexDirection:"column", overflow:"hidden"}} key="login">
          <PageLogin/>
        </div>
      </PFrame>
    );
  }

  // Onboarding is full-frame (no sidebar)
  if (s.route === "onboarding") {
    return (
      <PFrame url="bloom.app/setup">
        <div className="page-enter" style={{flex:1, display:"flex", flexDirection:"column", overflow:"hidden"}} key="onb">
          <ProtoOnboarding/>
        </div>
      </PFrame>
    );
  }

  // Otherwise: shell + active page
  let page = null;
  switch (s.route) {
    case "home":         page = <PageHome/>;         break;
    case "jobs":         page = <PageApplications/>; break;  // Jobs nav removed — funnels into Applications
    case "applications": page = <PageApplications/>; break;
    case "copilot":      page = <PageCopilot/>;      break;
    case "review":       page = <PageReview/>;       break;
    case "submitted":    page = <PageSubmitted/>;    break;
    case "settings":     page = <PageSettings/>;     break;
    default:             page = <PageHome/>;
  }

  return (
    <PFrame url={routeToUrl(s.route, s.params, s.jobs)}>
      <PShell>
        <div key={s.route + (s.params.jobId || "")} className="page-enter" style={{flex: 1, display:"flex", flexDirection:"column", overflow:"hidden", minHeight: 0, position:"relative"}}>
          {page}
        </div>
      </PShell>
    </PFrame>
  );
}

function routeToUrl(route, params, jobs) {
  if (route === "review") {
    const job = jobs.find(j => j.id === params.jobId);
    return `bloom.app/review/${(job?.co || "").toLowerCase()}`;
  }
  if (route === "submitted") {
    const job = jobs.find(j => j.id === params.jobId);
    return `bloom.app/applications/${(job?.co || "").toLowerCase()}`;
  }
  return `bloom.app/${route === "home" ? "" : route}`;
}

function App() {
  return (
    <StoreProvider>
      <div className="stage">
        <Router/>
      </div>
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
