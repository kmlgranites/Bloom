<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom V3 · Manager Review — V2 → V3 redesign</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">

<style>
  @font-face{font-family:"Proxima Soft";src:url("genz/fonts/proxima-nova-soft-regular.ttf") format("truetype");font-weight:400;font-display:swap}
  @font-face{font-family:"Proxima Soft";src:url("genz/fonts/proxima-nova-soft-medium.ttf") format("truetype");font-weight:500;font-display:swap}
  @font-face{font-family:"Proxima Soft";src:url("genz/fonts/proxima-nova-soft-semibold.ttf") format("truetype");font-weight:600;font-display:swap}
  @font-face{font-family:"Proxima Soft";src:url("genz/fonts/proxima-nova-soft-bold.ttf") format("truetype");font-weight:700;font-display:swap}
  @font-face{font-family:"Filson Soft";src:local("Nunito");font-weight:700}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;font-family:"Proxima Soft",system-ui,sans-serif}
  body{background:#EEF0EB;overflow:hidden;color:#022F36}
  button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;outline:none}

  @keyframes sprPulse {
    0%, 100% { opacity:.35; transform:scale(.7); }
    50%      { opacity:1;   transform:scale(1);  }
  }
  @keyframes sprBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  @keyframes sprRipple {
    0%   { transform: scale(0.85); opacity: 0.6; }
    100% { transform: scale(1.35); opacity: 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="genz/design-canvas.jsx"></script>
<script type="text/babel" src="genz/tweaks-panel.jsx"></script>
<script type="text/babel" src="genz/sprout-shared.jsx"></script>
<script type="text/babel" src="genz/sprout-desktop-1.jsx"></script>
<script type="text/babel" src="genz/sprout-desktop-2.jsx"></script>
<script type="text/babel" src="genz/sprout-desktop-3.jsx"></script>
<script type="text/babel" src="genz/v2-faithful-mocks.jsx"></script>

<script type="text/babel" data-presets="env,react">
const {
  DesignCanvas, DCSection, DCArtboard,
  TweaksPanel, useTweaks, TweakSection, TweakRadio,
  sprT, SproutMascot,
  D_Welcome, D_Onboarding, D_Resume, D_ModePicker, D_Activation,
  D_Home, D_Discovery, D_Review, D_SproutPanel,
  V2_Signup, V2_CreateFirstCopilot, V2_Config1, V2_Config2, V2_Config3, V2_Dashboard, V2_Tracker,
} = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showProblemTags": true
}/*EDITMODE-END*/;

// ─────────────────────────────────────────────────────────────────────
// Layout primitives
// ─────────────────────────────────────────────────────────────────────
function ProblemBadge({ num, color = sprT.flame, children, big }) {
  return (
    <div style={{
      display:"inline-flex", alignItems:"center", gap: 8,
      padding: big ? "8px 16px" : "5px 12px", borderRadius: 999,
      background: color, color:"#fff",
      fontSize: big ? 13 : 11, fontWeight: 800, letterSpacing:"0.03em",
    }}>
      <span style={{
        width: big ? 22 : 18, height: big ? 22 : 18, borderRadius:"50%",
        background:"rgba(255,255,255,0.25)", display:"grid", placeItems:"center",
        fontSize: big ? 12 : 11, fontWeight: 800,
      }}>{num}</span>
      {children}
    </div>
  );
}

// Wrapper that scales a 1280px-wide frame down to fit a column
function Mini({ children, srcW = 1280, srcH = 820, width = 540 }) {
  const scale = width / srcW;
  return (
    <div style={{
      width, height: srcH * scale, position:"relative", overflow:"hidden",
      borderRadius: 14, boxShadow: "0 18px 36px -12px rgba(2,47,54,0.18), 0 0 0 1px rgba(0,0,0,0.06)",
    }}>
      <div style={{
        width: srcW, height: srcH, transform:`scale(${scale})`, transformOrigin:"top left",
        position:"absolute", top: 0, left: 0,
      }}>
        {children}
      </div>
    </div>
  );
}

function VsLabel({ tone, children }) {
  const colors = tone === "before"
    ? {bg: "#FFEFEA", border: "#F76638", ink: "#A23A1B"}
    : {bg: "#E1F8EB", border: "#00B16B", ink: "#0F7A4A"};
  return (
    <div style={{
      display:"inline-flex", alignItems:"center", gap: 8,
      padding: "5px 12px", borderRadius: 999, fontSize: 12, fontWeight: 800,
      background: colors.bg, color: colors.ink, border: `1px solid ${colors.border}`,
      letterSpacing: "0.04em", textTransform:"uppercase",
    }}>
      <span style={{width: 6, height: 6, borderRadius:"50%", background: colors.border}}/>
      {children}
    </div>
  );
}

// One side of a comparison column (frame + caption)
function CompareColumn({ tone, title, caption, children }) {
  return (
    <div style={{flex: 1, display:"flex", flexDirection:"column", gap: 10}}>
      <div style={{display:"flex", alignItems:"center", gap: 10}}>
        <VsLabel tone={tone}>{tone === "before" ? "Today · V2" : "Proposed · V3"}</VsLabel>
        <div style={{fontSize: 15, fontWeight: 700, color: sprT.ink, letterSpacing:"-0.01em"}}>{title}</div>
      </div>
      {children}
      <div style={{fontSize: 12.5, color: sprT.inkSoft, fontWeight: 500, lineHeight: 1.45, padding:"0 4px", maxWidth: 540}}>{caption}</div>
    </div>
  );
}

// Comparison block — title + 2 mini-frames + annotation footer
function CompareSlide({ id, badges, headline, sub, before, after, fixes }) {
  return (
    <div style={{
      width: 1400, padding: 36, background:"#fff", borderRadius: 28,
      fontFamily: '"Proxima Soft",sans-serif', color: sprT.ink,
      display:"flex", flexDirection:"column", gap: 24,
      border: `1px solid ${sprT.hairline}`,
    }}>
      {/* Header */}
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap: 40}}>
        <div style={{flex: 1, minWidth: 0}}>
          <div style={{display:"flex", gap: 8, flexWrap:"wrap", marginBottom: 12}}>
            {badges.map((b,i) => <ProblemBadge key={i} num={b.num} color={b.color}>{b.label}</ProblemBadge>)}
          </div>
          <div style={{fontFamily: window.fontDisplay, fontSize: 36, fontWeight: 700, color: sprT.ink, lineHeight: 1.05, letterSpacing:"-0.025em", marginBottom: 8}}>{headline}</div>
          <div style={{fontSize: 15, color: sprT.inkSoft, fontWeight: 500, lineHeight: 1.5, maxWidth: 760}}>{sub}</div>
        </div>
        <div style={{display:"flex", gap: 6, fontSize: 11, fontWeight: 800, color: sprT.muted, letterSpacing:"0.05em", flexShrink: 0, paddingTop: 6}}>{id}</div>
      </div>

      {/* Two columns */}
      <div style={{display:"flex", gap: 20, alignItems:"flex-start"}}>
        {before}
        <div style={{paddingTop: 100, display:"flex", flexDirection:"column", alignItems:"center", gap: 4, color: sprT.muted}}>
          <div style={{fontSize: 28, fontWeight: 800, color: sprT.ink}}>→</div>
        </div>
        {after}
      </div>

      {/* What changed footer */}
      <div style={{
        background: sprT.cream, borderRadius: 18, padding: 20,
        display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap: 16,
      }}>
        {fixes.map((f,i) => (
          <div key={i} style={{display:"flex", gap: 12}}>
            <div style={{width: 28, height: 28, borderRadius: 8, background:"#fff", border:`1px solid ${sprT.hairline}`, display:"grid", placeItems:"center", fontSize: 14, flexShrink: 0}}>{f.icon}</div>
            <div>
              <div style={{fontSize: 13, fontWeight: 700, color: sprT.ink, marginBottom: 3, letterSpacing:"-0.005em"}}>{f.h}</div>
              <div style={{fontSize: 12, color: sprT.inkSoft, fontWeight: 500, lineHeight: 1.45}}>{f.b}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// Recap slide (the 4 problems)
// ─────────────────────────────────────────────────────────────────────
function Recap() {
  const P = [
    {num: "1", color:"#F76638", h:"ROI is invisible", b:"Onboarding leads with features (\"set up your copilot\") instead of the outcome (\"more interviews, less burnout\")."},
    {num: "2", color:"#3F2F8F", h:"Multiple copilots", b:"V2 has a copilot grid — \"2 of 2 active sprouts.\" Operational, enterprise-y, off-brand for a consumer app."},
    {num: "3", color:"#0F7A4A", h:"Form-heavy UX", b:"Three wizard pages of dropdowns, checkboxes, and screening tables. Feels like an ATS, not a friend."},
    {num: "4", color:"#0BB3B3", h:"Autonomy buried", b:"3 modes hidden as a side-section in step 2. Users need to feel safe choosing how much control they want."},
  ];
  const F = [
    {num: "1", color:"#F76638", h:"Outcome-first copy", b:"Hero: \"Apply to 100+ jobs while you sleep.\" Every screen surfaces time saved, replies, and momentum."},
    {num: "2", color:"#3F2F8F", h:"One Sprout, named", b:"Single copilot with a face, voice, and personality. Lives in the left rail. \"+ New copilot\" is gone."},
    {num: "3", color:"#0F7A4A", h:"Chat replaces forms", b:"Onboarding is 3 short conversations. Tap chips. Drop résumé. Sprout summarises live and you fix what's wrong."},
    {num: "4", color:"#0BB3B3", h:"Modes are the headline", b:"\"How should I work?\" → Cruise / Co-pilot / Manual. Three persona cards. Co-pilot is recommended."},
  ];
  return (
    <div style={{
      width: 1400, padding: 48, background: sprT.cream, borderRadius: 28,
      fontFamily: '"Proxima Soft",sans-serif', color: sprT.ink,
    }}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom: 32, gap: 40}}>
        <div>
          <div style={{fontSize: 12, fontWeight: 800, color: sprT.muted, letterSpacing:"0.08em", marginBottom: 12}}>BLOOM · V3 PROPOSAL · MANAGER REVIEW</div>
          <div style={{fontFamily: window.fontDisplay, fontSize: 64, fontWeight: 700, lineHeight: 0.95, letterSpacing:"-0.035em", marginBottom: 14}}>
            4 pieces of feedback,<br/>
            <span style={{color: sprT.cyanInk}}>4 deliberate shifts.</span>
          </div>
          <div style={{fontSize: 17, color: sprT.inkSoft, fontWeight: 500, lineHeight: 1.5, maxWidth: 720}}>
            This document pairs each V2 screen with the proposed V3 redesign, mapped to your feedback. Scroll right for side-by-sides; the canvas is pan-and-zoomable.
          </div>
        </div>
        <div style={{flexShrink: 0, paddingTop: 6, display:"flex", flexDirection:"column", alignItems:"flex-end", gap: 8}}>
          <SproutMascot size={120}/>
          <div style={{fontSize: 12, fontWeight: 800, color: sprT.cyanInk, letterSpacing:"0.05em"}}>SAY HI TO SPROUT</div>
        </div>
      </div>

      {/* Two columns: feedback vs. our move */}
      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap: 16}}>
        {/* Manager feedback */}
        <div style={{background:"#fff", borderRadius: 22, padding: 24, border: `1px solid ${sprT.hairline}`}}>
          <div style={{fontSize: 12, fontWeight: 800, color:"#F76638", letterSpacing:"0.06em", marginBottom: 18, textTransform:"uppercase"}}>● Manager feedback (V2)</div>
          <div style={{display:"flex", flexDirection:"column", gap: 14}}>
            {P.map(p => (
              <div key={p.num} style={{display:"flex", gap: 14}}>
                <ProblemBadge num={p.num} color={p.color}>{p.h}</ProblemBadge>
                <div style={{flex:1, fontSize: 13.5, color: sprT.inkSoft, fontWeight: 500, lineHeight: 1.5, paddingTop: 3}}>{p.b}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Our shifts */}
        <div style={{background: sprT.ink, color:"#fff", borderRadius: 22, padding: 24, position:"relative", overflow:"hidden"}}>
          <div style={{position:"absolute", top:-40, right:-40, width: 220, height: 220, borderRadius:"50%", background: sprT.cyan, opacity: 0.15, filter:"blur(40px)"}}/>
          <div style={{fontSize: 12, fontWeight: 800, color: sprT.cyan, letterSpacing:"0.06em", marginBottom: 18, textTransform:"uppercase", position:"relative"}}>● V3 shifts</div>
          <div style={{display:"flex", flexDirection:"column", gap: 14, position:"relative"}}>
            {F.map(p => (
              <div key={p.num} style={{display:"flex", gap: 14}}>
                <ProblemBadge num={p.num} color={p.color}>{p.h}</ProblemBadge>
                <div style={{flex:1, fontSize: 13.5, color:"rgba(255,255,255,0.78)", fontWeight: 500, lineHeight: 1.5, paddingTop: 3}}>{p.b}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={{marginTop: 28, padding:"16px 22px", background:"#fff", borderRadius: 16, fontSize: 13.5, color: sprT.inkSoft, fontWeight: 500, lineHeight: 1.5, border:`1px solid ${sprT.hairline}`, display:"flex", gap: 14, alignItems:"center"}}>
        <div style={{fontSize: 22}}>📖</div>
        <div>
          <b style={{color: sprT.ink}}>How to read this:</b> each section pairs a faithful recreation of the V2 screen (left, in red) with the V3 redesign (right, in green). Click any frame to zoom in via the canvas focus mode.
        </div>
      </div>
    </div>
  );
}

function App() {
  const [t] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <DesignCanvas storageKey="bloom-v3-manager-review">

        <DCSection
          id="recap"
          title="① The 4 problems → 4 shifts"
          subtitle="Read this first. It sets up everything below."
        >
          <DCArtboard id="recap" label="Recap · manager feedback → V3 shifts" width={1400} height={780}>
            <Recap/>
          </DCArtboard>
        </DCSection>

        {/* ═════════════════════════════════════════════════════════════ */}
        <DCSection
          id="cmp-onboarding"
          title="② Onboarding · forms → chat"
          subtitle="Problems addressed: #1 ROI, #2 Multi-copilot framing, #3 Form-heavy UX"
        >
          <DCArtboard id="cmp-1" label="V2 Step 1 (role basics) vs V3 chat onboarding" width={1480} height={1080}>
            <CompareSlide
              id="VS · 01"
              badges={[
                {num:"1", color:"#F76638", label:"ROI"},
                {num:"2", color:"#3F2F8F", label:"Multi-copilot"},
                {num:"3", color:"#0F7A4A", label:"Forms"},
              ]}
              headline="Three forms become three conversations."
              sub={`The V2 wizard asks 12+ form fields before showing a single result. V3 turns onboarding into a Sprout chat: tap chips, drop your résumé, pick a driving style. ~90 seconds end-to-end. The phrase "your copilot" is gone — there's only Sprout.`}
              before={
                <CompareColumn tone="before" title="Wizard Step 1 of 3" caption={`Five form sections per step, three steps. ATS-style chips and dropdowns. "What kind of role are looking for?" appears 1 of 3 — the user can't see how long it is.`}>
                  <Mini width={640} srcH={820}><V2_Config1/></Mini>
                </CompareColumn>
              }
              after={
                <CompareColumn tone="after" title="Sprout asks. You tap." caption="Same data, collected conversationally. Sprout greets you by name, asks one question at a time, and chips do 90% of the work. Composer accepts free text too if a chip doesn't fit.">
                  <Mini width={640} srcH={820}><D_Onboarding/></Mini>
                </CompareColumn>
              }
              fixes={[
                {icon:"💬", h:"Conversation > form", b:"Onboarding feels like texting a friend who's helping you, not configuring software."},
                {icon:"🌱", h:"One copilot, named", b:"\"Create your first copilot\" is gone. Sprout has a face from screen 1 — no \"set up\" framing."},
                {icon:"⏱", h:"~90 seconds total", b:"V2 wizard is ~3 minutes by their own admission. V3 collects same data in a third of the time."},
              ]}
            />
          </DCArtboard>

          <DCArtboard id="cmp-2" label="V2 résumé form vs V3 résumé + AI summary" width={1480} height={1080}>
            <CompareSlide
              id="VS · 02"
              badges={[
                {num:"3", color:"#0F7A4A", label:"Forms"},
                {num:"1", color:"#F76638", label:"ROI"},
              ]}
              headline="Don't make the user fill the screening table — show them what AI already knows."
              sub="V2 makes the user verify 17 screening answers in a dense table before activating. V3 inverts it: Sprout reads the résumé and shows what it learned as a confident summary. You correct what's wrong. Faster, lighter, and proves the AI is working."
              before={
                <CompareColumn tone="before" title="Step 3 · screening table" caption={`Resume upload + cover letter binary + screening answers as form rows. Three sections, ATS terminology ("ATS-friendly", "keywords missing"). The work to verify is the user's.`}>
                  <Mini width={640} srcH={820}><V2_Config3/></Mini>
                </CompareColumn>
              }
              after={
                <CompareColumn tone="after" title="Drop & summarise" caption="Drop area on the left, Sprout's parsed understanding on the right (you / best-at / hunting-for / vibe / avoid). The summary IS the proof the AI works. Edit chips, not form fields.">
                  <Mini width={640} srcH={820}><D_Resume/></Mini>
                </CompareColumn>
              }
              fixes={[
                {icon:"📄", h:"One drop replaces a form", b:"Résumé does the talking. Sprout extracts the same data without making the user re-type it."},
                {icon:"✨", h:"Proof of AI, immediately", b:"The summary is a live demonstration of the copilot's value before activation. ROI moment #1."},
                {icon:"🪶", h:"Edit by chip, not field", b:"Wrong title? Tap the chip and pick a new one. No modal, no dropdown, no form validation."},
              ]}
            />
          </DCArtboard>
        </DCSection>

        {/* ═════════════════════════════════════════════════════════════ */}
        <DCSection
          id="cmp-modes"
          title="③ Autonomy · buried setting → headline question"
          subtitle="Problem addressed: #4 Autonomy modes need to be empowering, not configuration"
        >
          <DCArtboard id="cmp-3" label="V2 autonomy as side-section vs V3 dedicated mode picker" width={1480} height={1080}>
            <CompareSlide
              id="VS · 03"
              badges={[
                {num:"4", color:"#0BB3B3", label:"Autonomy"},
                {num:"3", color:"#0F7A4A", label:"Forms"},
              ]}
              headline="Stop hiding the most important question."
              sub="V2 stuffs three autonomy modes into step 2 alongside Match Strength, Seniority, Industry, and a tip box — buried beneath 4 other form sections. V3 makes it the entire final screen: one big question, three persona cards. Recommended mode is pre-selected."
              before={
                <CompareColumn tone="before" title="Step 2 · autonomy is row 4 of 4" caption="Three modes tacked onto a filters page. Stats are tiny (~40/day vs ~25/day), card affordance is small, no mascot, no personality. Easy to skim past without realizing it's the most important choice in setup.">
                  <Mini width={640} srcH={820}><V2_Config2/></Mini>
                </CompareColumn>
              }
              after={
                <CompareColumn tone="after" title="One question, three personas" caption={`Sprout asks: "How should I work?" Cards are full-width with mascot expressions per mode (sleeping/happy/thinking), 3 stats each, 4 bullets, and a single CTA. Co-pilot is pre-selected as the recommended default.`}>
                  <Mini width={640} srcH={840}><D_ModePicker/></Mini>
                </CompareColumn>
              }
              fixes={[
                {icon:"🎚", h:"It's THE question", b:"Modes get their own screen, not a sub-section. The choice feels significant because it is."},
                {icon:"🚀", h:"Two modes, framed clearly", b:"Cruise (Auto) and Co-pilot (Review-before-send) match your brief. Manual stays as the safety net."},
                {icon:"🐭", h:"Mascot does emotional work", b:"Sleeping mascot for Cruise, working mascot for Co-pilot. The AI's posture is visible at a glance."},
              ]}
            />
          </DCArtboard>
        </DCSection>

        {/* ═════════════════════════════════════════════════════════════ */}
        <DCSection
          id="cmp-roi"
          title="④ ROI · feature list → outcome moment"
          subtitle="Problem addressed: #1 ROI Communication — users should feel the value, not read about it"
        >
          <DCArtboard id="cmp-4" label={`V2 "create first copilot" vs V3 welcome + activation`} width={1480} height={1080}>
            <CompareSlide
              id="VS · 04"
              badges={[
                {num:"1", color:"#F76638", label:"ROI"},
                {num:"2", color:"#3F2F8F", label:"Multi-copilot"},
              ]}
              headline="Lead with the outcome, not the setup."
              sub={`V2 says "Create your first copilot" with a tiny benefits list. V3 leads with the outcome ("Apply to 100+ jobs while you sleep"), uses the mascot for emotional weight, and turns activation into a live demonstration: Sprout reading 12,400 roles in real time.`}
              before={
                <CompareColumn tone="before" title={`"One Last Step"`} caption={`"Create your first copilot" implies more to come. Benefits read as a checklist (No credit card · 7-day trial · Set up in 3 min · Works while you sleep · You stay in control). Outcome buried below CTA.`}>
                  <Mini width={640} srcH={820}><V2_CreateFirstCopilot/></Mini>
                </CompareColumn>
              }
              after={
                <CompareColumn tone="after" title="Outcome-first welcome" caption={`The headline IS the outcome: "Apply to 100+ jobs while you sleep." Mascot present with sparkles. Trust strip (500k users · 4.8★) at the top, not the bottom. "Watch 60s tour" as a secondary CTA.`}>
                  <Mini width={640} srcH={820}><D_Welcome/></Mini>
                </CompareColumn>
              }
              fixes={[
                {icon:"🌙", h:"Outcome is the H1", b:"\"Apply to 100+ jobs while you sleep\" — the value prop is the hero, not the setup time."},
                {icon:"❤️", h:"Mascot does the trust work", b:"Sprout's face replaces \"500k Job Seekers\" small-text. Personality > stats for Gen Z."},
                {icon:"✨", h:"No \"first copilot\" framing", b:"Activation is meeting Sprout, not creating an agent. The plural is gone everywhere."},
              ]}
            />
          </DCArtboard>

          <DCArtboard id="cmp-5" label="V2 generic loader vs V3 activation moment" width={1480} height={1080}>
            <CompareSlide
              id="VS · 05"
              badges={[
                {num:"1", color:"#F76638", label:"ROI"},
                {num:"3", color:"#0F7A4A", label:"Forms"},
              ]}
              headline="The wait screen is a marketing moment."
              sub={`V2 shows a percentage bar and a wall of explainer text about how to use the application tracker. V3 reframes the 20 seconds as theatre: "Reading 12,400 open roles for you," with a checklist of what the AI is doing live, and the mascot in a halo of expanding rings.`}
              before={
                <CompareColumn tone="before" title={`"Your copilot is coming to life…"`} caption="14% progress bar. ~20s remaining. Followed by 200 words of disclaimer text about how to use the application tracker — none of which the user cares about right now.">
                  <Mini width={640} srcH={820}><V2_LoadingFallback/></Mini>
                </CompareColumn>
              }
              after={
                <CompareColumn tone="after" title="Sprout is working — visibly" caption="Dark background, cyan glow, the mascot breathing inside concentric rings. The progress is a live ledger of AI work: 'Read 12,400 roles → Ranking by fit (60%) → Tailoring first 5 drafts.' Every line reinforces value.">
