<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom — Resume Parsing Loader</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  @font-face{font-family:"Proxima Soft";src:url("fonts/proxima-nova-soft-regular.ttf");font-weight:400}
  @font-face{font-family:"Proxima Soft";src:url("fonts/proxima-nova-soft-medium.ttf");font-weight:500}
  @font-face{font-family:"Proxima Soft";src:url("fonts/proxima-nova-soft-semibold.ttf");font-weight:600}
  @font-face{font-family:"Proxima Soft";src:url("fonts/proxima-nova-soft-bold.ttf");font-weight:700}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;font-family:"Proxima Soft",system-ui,sans-serif}
  body{background:#F0F3F7;overflow:hidden}
  button{cursor:pointer;font-family:"Proxima Soft",sans-serif;border:none;background:none}
  input{font-family:"Proxima Soft",sans-serif}
  .num{font-family:"Inter",sans-serif;font-feature-settings:"tnum"}

  /* Mascot gentle bob */
  @keyframes loaderBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  /* Shadow shrinks when mascot lifts */
  @keyframes loaderShadow {
    0%, 100% { opacity:.18; transform: translateX(-50%) scaleX(1); }
    50%      { opacity:.10; transform: translateX(-50%) scaleX(.7); }
  }
  /* Progress bar shimmer */
  @keyframes loaderShimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: -200% 50%; }
  }
  /* Headline fade-in */
  @keyframes loaderFade {
    from { opacity:0; transform: translateY(6px); }
    to   { opacity:1; transform: translateY(0); }
  }
  /* Active-stage dot pulse */
  @keyframes loaderPulse {
    0%, 100% { opacity:1; transform: scale(1); }
    50%      { opacity:.4; transform: scale(.7); }
  }
  /* Ellipsis dots */
  @keyframes loaderDot {
    0%, 60%, 100% { opacity: .25; }
    30%           { opacity: 1; }
  }

  /* Range slider styling */
  input[type="range"] {
    -webkit-appearance:none; appearance:none;
    height:4px; background:#E2E8F0; border-radius:99px;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:16px; height:16px; border-radius:50%;
    background:#022F36; cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  input[type="range"]::-moz-range-thumb {
    width:16px; height:16px; border-radius:50%;
    background:#022F36; cursor:pointer; border:none;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="LoaderScreen.jsx"></script>
</body>
</html>
