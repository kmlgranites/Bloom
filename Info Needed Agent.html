/* ─── Bold-text renderer ─── */
function T({ t }) {
  const parts = String(t).split(/(\*\*[^*]+\*\*)/g);
  return <>{parts.map((p,i) => p.startsWith('**')
    ? <strong key={i} style={{color:C.brandDark}}>{p.slice(2,-2)}</strong>
    : p)}</>;
}

/* ─── ARS Donut ─── */
function ARSDonut({ score }) {
  const r = 28, sw = 5.5, circ = 2*Math.PI*r;
  return (
    <svg width={66} height={66} style={{transform:"rotate(-90deg)"}}>
      <circle cx={33} cy={33} r={r} fill="none" stroke="#EBEBEB" strokeWidth={sw} />
      <circle cx={33} cy={33} r={r} fill="none" stroke={C.cyan} strokeWidth={sw}
        strokeDasharray={`${(score/100)*circ} ${circ}`} strokeLinecap="round"
        style={{transition:"stroke-dasharray 1s cubic-bezier(.4,0,.2,1)"}} />
    </svg>
  );
}

/* ─── ARS Card ─── */
function ARSCard({ score }) {
  const base = 47;
  const cats = [
    {label:"Work Authorization", filled: score>=55},
    {label:"Availability",       filled: score>=62},
    {label:"Salary Range",       filled: score>=70},
    {label:"Career History",     filled: score>=76},
    {label:"Employment",         filled: score>=82},
  ];
  return (
    <div style={{background:"#fff",borderBottom:`1px solid ${C.border}`,padding:"14px 16px 12px"}}>
      <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
        {/* Donut */}
        <div style={{position:"relative",flexShrink:0}}>
          <ARSDonut score={score} />
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:17,fontWeight:700,color:C.brandDark,lineHeight:1,
              ...(score>base?{animation:"score-up 0.6s ease"}:{})}}>{score}</span>
            <span style={{fontSize:7,fontWeight:700,color:C.muted,letterSpacing:"0.06em",textTransform:"uppercase"}}>/100</span>
          </div>
        </div>
        {/* Text + bars */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
            <span style={{fontSize:12,fontWeight:700,color:C.text1}}>Automation Readiness</span>
            {score>base && (
              <span style={{background:"#E6F9F1",color:C.green,fontSize:9,fontWeight:700,
                borderRadius:9999,padding:"2px 7px"}}>+{score-base} today</span>
            )}
          </div>
          <p style={{fontSize:10,color:C.text3,lineHeight:1.5,marginBottom:9}}>
            Every answer is saved and reused on future applications.
          </p>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            {cats.map(c=>(
              <div key={c.label} style={{display:"flex",alignItems:"center",gap:7}}>
                <i className={`ti ti-${c.filled?"circle-check-filled":"circle"}`}
                  style={{fontSize:10,color:c.filled?C.green:"#D4D4D4",flexShrink:0}} />
                <span style={{fontSize:9.5,color:c.filled?C.text2:C.muted,fontWeight:c.filled?600:400,flex:1}}>{c.label}</span>
                {c.filled && <span style={{fontSize:9,color:C.green,fontWeight:700}}>✓ saved</span>}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function TextInputComp({ data, onSubmit }) {
  const [val,setVal] = useState("");
  return (
    <div style={{background:"#fff",border:`1px solid ${C.border2}`,borderRadius:10,overflow:"hidden"}}>
      <textarea
        value={val}
        onChange={e=>setVal(e.target.value)}
        placeholder={data.placeholder}
        rows={3}
        style={{width:"100%",border:"none",padding:"10px 12px",fontSize:12.5,
          color:C.text2,resize:"none",lineHeight:1.55,background:"transparent"}}
      />
      <div style={{padding:"6px 10px",borderTop:`1px solid ${C.border2}`,
        display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:10,color:C.muted}}>{val.length} / 200 words</span>
        <button onClick={()=>val.trim()&&onSubmit(val)} style={{
          background:val.trim()?C.brandMid:"#D4D4D4",color:"#fff",border:"none",
          borderRadius:9999,padding:"5px 16px",fontSize:11,fontWeight:700,
          transition:"background .15s"}}>Submit</button>

    </div>
  );
}

function ActivityLog() {
  const [step, setStep] = useState(0);
  const items = [
    {icon:"ti-check",text:"Work authorization — saved to profile",status:"done",app:"All apps"},
    {icon:"ti-check",text:"Notice period — saved to profile",status:"done",app:"All apps"},

    {icon:"ti-loader",text:"Okta (2) — filling 5 fields…",status:"pending",app:"Okta"},
  ];
  useEffect(()=>{
    const t = setInterval(()=>setStep(s=>s<items.length?s+1:s),380);
    return ()=>clearInterval(t);
  },[]);
  const shown = items.slice(0, step);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:5}}>
      {shown.map((it,i)=>(
        <div key={i} className="msg-in" style={{display:"flex",alignItems:"center",gap:9,

}

        boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
        {children}
      </div>
    </div>
  );
}

function UserBubble({ text }) {
  return (
    <div style={{display:"flex",justifyContent:"flex-end",marginBottom:9}}>
      <div style={{background:C.brandMid,color:"#fff",borderRadius:"14px 4px 14px 14px",
        padding:"9px 14px",fontSize:13,fontWeight:500,maxWidth:"80%",lineHeight:1.5}}>
        {text}
      </div>
    </div>
  );
}

function Typing() {
  return (
    <div style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:9}}>
      <img src="assets/favicon.png" alt="" style={{width:24,height:24,borderRadius:"50%",flexShrink:0,
        border:`1.5px solid ${C.cyan}66`}} />
      <div style={{background:"#F2F5F8",borderRadius:"4px 14px 14px 14px",padding:"12px 14px",
        display:"flex",gap:4,alignItems:"center"}}>
        {[0,1,2].map(i=>(
          <div key={i} style={{width:6,height:6,borderRadius:"50%",background:"#BCC4CE",
            animation:`bloom-bounce 1.3s ease ${i*0.18}s infinite`}} />
        ))}
      </div>
    </div>

}

/* ─── Message renderer ─── */
function RenderMsg({ msg, onTextSubmit }) {
  if (msg.from==="user") return <UserBubble text={msg.t} />;
  let inner;
  switch(msg.comp) {
    case "apps_preview":  inner = <AppsPreview />; break;
    case "cluster_preview": inner = <ClusterPreview />; break;
    case "q_header":      inner = <QHeader data={msg.data} />; break;
    case "text_input":    inner = <TextInputComp data={msg.data} onSubmit={onTextSubmit} />; break;
    case "activity_log":  inner = <ActivityLog />; break;
    case "summary_card":  inner = <SummaryCard />; break;
    default:              inner = <T t={msg.t} />;
  }
  return <AiBubble>{inner}</AiBubble>;
}

/* ─── Chips row ─── */
function Chips({ chips, onChip, disabled }) {
  const [hov,setHov] = useState(null);
  return (
    <div style={{display:"flex",flexWrap:"wrap",gap:7,padding:"4px 0 4px 32px"}}>
      {chips.map((ch,i)=>(
        <button key={i}
          onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}
          onClick={()=>!disabled&&onChip(ch)}
          style={{
            background:ch.primary?(hov===i?"#022F36":C.brandMid):(hov===i?"#F5F7FA":"#fff"),
            color:ch.primary?"#fff":C.text2,
            border:`1.5px solid ${ch.primary?C.brandMid:C.border2}`,
            borderRadius:9999,padding:"7px 16px",fontSize:12.5,fontWeight:600,
            transition:"all .13s",opacity:disabled?.5:1,
          }}>{ch.label}</button>
      ))}
    </div>
  );
}

/* ─── Top Nav ─── */

}

/* ─── Application card ─── */
function AppCard({ app, completed, onComplete }) {
  const pctFill = app.total ? (app.filled/app.total)*100 : 0;
  if (app.done) return (
    <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:12,
      padding:"14px 18px",display:"flex",alignItems:"center",gap:12}}>
      <div style={{width:40,height:40,borderRadius:10,background:app.logoBg,
        display:"flex",alignItems:"center",justifyContent:"center",
        fontSize:13,fontWeight:700,color:app.logoColor,flexShrink:0}}>{app.logo}</div>
      <div style={{flex:1}}>
        <div style={{fontSize:14,fontWeight:700,color:C.text1}}>{app.role}</div>
        <div style={{fontSize:12,color:C.text3}}>{app.company} · {app.location}</div>
      </div>
      <span style={{background:"#E6F9F1",color:C.green,borderRadius:9999,
        padding:"4px 12px",fontSize:11,fontWeight:700}}>✓ Submitted</span>
    </div>
  );
  if (app.processing) return (
    <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:12,
      padding:"14px 18px",display:"flex",alignItems:"center",gap:12}}>
      <div style={{width:40,height:40,borderRadius:10,background:app.logoBg,
        display:"flex",alignItems:"center",justifyContent:"center",
        fontSize:13,fontWeight:700,color:app.logoColor,flexShrink:0}}>{app.logo}</div>
      <div style={{flex:1}}>
        <div style={{fontSize:14,fontWeight:700,color:C.text1}}>{app.role}</div>
        <div style={{fontSize:12,color:C.text3}}>{app.company} · {app.location}</div>
      </div>
      <span style={{background:"#F0F0FF",color:"#5E6AD2",borderRadius:9999,
        padding:"4px 12px",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",gap:5}}>
        <i className="ti ti-loader" style={{fontSize:10}} />Processing
      </span>
    </div>
  );
  return (
    <div style={{background:"#fff",border:`1.5px solid ${completed?"#A7F3D0":C.border}`,borderRadius:12,
      boxShadow:"0 2px 6px rgba(0,0,0,0.04)",transition:"border-color .3s"}}>
      <div style={{padding:"14px 18px 10px"}}>
        <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
          <div style={{width:40,height:40,borderRadius:10,background:app.logoBg,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:13,fontWeight:700,color:app.logoColor,flexShrink:0}}>{app.logo}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,fontWeight:700,color:C.text1}}>{app.role}</div>
            <div style={{fontSize:12,color:C.text3}}>{app.company} · {app.location}</div>
          </div>
          {completed
            ? <span style={{background:"#E6F9F1",color:C.green,borderRadius:9999,
                padding:"4px 12px",fontSize:11,fontWeight:700}}>✓ Complete</span>
            : <span style={{background:"#FFF3ED",color:C.orange,borderRadius:9999,
                padding:"4px 10px",fontSize:11,fontWeight:700,
                border:`1px solid ${C.orange}33`,display:"flex",alignItems:"center",gap:4}}>
                <i className="ti ti-alert-triangle" style={{fontSize:11}} />
                {app.missing} fields
              </span>
          }
        </div>
        <div style={{marginTop:10}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
            <span style={{fontSize:11,color:C.text3}}>Application completion</span>
            <span style={{fontSize:11,fontWeight:700,color:C.text3,fontFamily:"Inter,sans-serif"}}>
              {completed?app.total:app.filled} / {app.total}
            </span>
          </div>
          <div style={{height:4,background:"#EBEBEB",borderRadius:9999,overflow:"hidden"}}>
            <div style={{height:"100%",borderRadius:9999,
              background:completed?C.green:C.orange,
              width:`${completed?100:pctFill}%`,transition:"width 0.8s ease"}} />
          </div>
        </div>
      </div>
      <div style={{borderTop:`1px solid ${C.border2}`,display:"flex",gap:0}}>
        <button style={{flex:1,padding:"9px 0",border:"none",background:"transparent",
          fontSize:12,fontWeight:600,color:C.text3,display:"flex",alignItems:"center",
          justifyContent:"center",gap:6,borderRight:`1px solid ${C.border2}`}}>
          <i className="ti ti-file-description" style={{fontSize:13}} />View Application
        </button>
        <button style={{flex:1,padding:"9px 0",border:"none",background:"transparent",
          fontSize:12,fontWeight:600,color:C.text3,display:"flex",alignItems:"center",
          justifyContent:"center",gap:6,borderRight:`1px solid ${C.border2}`}}>
          <i className="ti ti-player-play" style={{fontSize:13}} />View Recording
        </button>
        {!completed && (
          <button onClick={onComplete} style={{flex:1,padding:"9px 0",border:"none",
            background:"linear-gradient(135deg,#022F36,#1D484F)",
            fontSize:12,fontWeight:700,color:"#fff",
            display:"flex",alignItems:"center",justifyContent:"center",gap:6,borderRadius:"0 0 10px 0"}}>
            <img src="assets/favicon.png" alt="" style={{width:14,height:14,borderRadius:"50%"}} />
            Complete with AI
          </button>
        )}
      </div>
    </div>
  );
}

/* ─── Main App ─── */
function App() {
  const [stateKey, setStateKey] = useState("idle");
  const [allMsgs, setAllMsgs] = useState([]);
  const [typing, setTyping] = useState(false);
  const [chipsLocked, setChipsLocked] = useState(false);
  const [textInputActive, setTextInputActive] = useState(false);
  const [completed, setCompleted] = useState(false);
  const [started, setStarted] = useState(false);
  const endRef = useRef(null);
  const timers = useRef([]);

  const clearT = () => { timers.current.forEach(clearTimeout); timers.current=[]; };

  const appendMsgs = useCallback((msgs, cb) => {
    let delay = 0;
    msgs.forEach((m,i) => {
      const isAgent = m.from==="ai" && !m.comp;
      if (isAgent) {
        timers.current.push(setTimeout(()=>setTyping(true), delay));
        delay += 600;
      }
      timers.current.push(setTimeout(()=>{
        setTyping(false);
        setAllMsgs(prev=>[...prev, {...m, _id: Date.now()+i}]);
        if (i===msgs.length-1 && cb) setTimeout(cb, 300);
      }, delay));
      delay += isAgent ? 100 : 200;
    });
  }, []);

  const goToState = useCallback((key, userMsg) => {
    clearT();
    setChipsLocked(true);
    setTextInputActive(false);
    const script = FLOW[key];
    if (!script) return;
    setStateKey(key);

    const intro = [];
    if (userMsg) intro.push({from:"user", t:userMsg, _id:Date.now()});
    const rest = script.msgs.map(m=>({...m}));

    appendMsgs([...intro,...rest], ()=>{
      setChipsLocked(false);
      if (script.inputField) setTextInputActive(true);
      if (key==="summary") setCompleted(true);
    });
  }, [appendMsgs]);

  // Boot
  useEffect(()=>{
    if (started) return;
    return;
  }, []);

  const handleStart = () => {
    if (started) return;
    setStarted(true);
    goToState("idle");
  };

  const handleChip = (chip) => {
    if (chipsLocked) return;
    goToState(chip.next, chip.label);
  };

  const handleTextSubmit = (val) => {
    setTextInputActive(false);
    const cur = FLOW[stateKey];
    if (!cur) return;
    const nextKey = stateKey==="q_highlight"?"q_employer":"completing";
    goToState(nextKey, val.slice(0,60)+(val.length>60?"…":""));
  };

  // Scroll
  useEffect(()=>{
    if (endRef.current) {
      endRef.current.parentElement.scrollTop = endRef.current.offsetTop;
    }
  }, [allMsgs, typing]);

  const curScript = FLOW[stateKey] || {};
  const arsScore = curScript.ars || 47;

  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <TopNav />
      <div style={{flex:1,display:"flex",overflow:"hidden",background:C.bgPage}}>

        {/* ── Left Panel ── */}
        <div style={{flex:1,overflowY:"auto",padding:"20px 20px 20px 24px",minWidth:0}}>

          {/* Attention banner */}
          {!completed ? (
            <div style={{background:C.amber,borderRadius:14,
              border:`1px solid ${C.amberBorder}`,padding:"16px 20px",
              display:"flex",alignItems:"center",gap:16,marginBottom:20,
              boxShadow:"0 2px 6px rgba(0,0,0,0.06)"}}>
              <div style={{width:52,height:52,borderRadius:"50%",background:"#fff",
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:26,fontWeight:700,color:"#5B4841",flexShrink:0,
                boxShadow:"0 1px 4px rgba(0,0,0,0.08)"}}>3</div>
              <div style={{flex:1}}>
                <div style={{fontSize:17,fontWeight:700,color:"#120B0B",opacity:.8}}>Applications</div>
                <div style={{fontSize:15,fontWeight:500,color:"#120B0B"}}>Need Your Attention</div>
              </div>
              <button onClick={handleStart} style={{
                background:"linear-gradient(160deg,#F76638 0%,#D72A2A 100%)",
                color:"#fff",border:"none",borderRadius:9,padding:"9px 20px",
                fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:8,
                boxShadow:"0 2px 8px rgba(247,102,56,0.4)"}}>
                <img src="assets/favicon.png" alt="" style={{width:16,height:16,borderRadius:"50%"}} />
                Complete with AI
              </button>
            </div>
          ) : (
            <div style={{background:"#E6F9F1",borderRadius:14,border:"1px solid #A7F3D0",
              padding:"14px 20px",display:"flex",alignItems:"center",gap:14,marginBottom:20}}>
              <div style={{width:40,height:40,borderRadius:"50%",background:C.green,
                display:"flex",alignItems:"center",justifyContent:"center"}}>
                <i className="ti ti-check" style={{fontSize:18,color:"#fff"}} />
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:15,fontWeight:700,color:"#065F46"}}>All 3 applications completed!</div>
                <div style={{fontSize:12,color:"#047857"}}>14 fields auto-filled · Submitted for processing</div>
              </div>
              <span style={{fontSize:12,fontWeight:700,color:C.green}}>Readiness: 47 → 82 ✨</span>
            </div>
          )}

          {/* Stats row */}
          <div style={{display:"flex",gap:12,marginBottom:20}}>
            {[
              {label:"Need Attention",val:completed?"0":"3",color:C.orange,icon:"ti-alert-triangle"},
              {label:"Processing",val:"2",color:C.brandMid,icon:"ti-loader"},
              {label:"Submitted",val:completed?"3":"0",color:C.green,icon:"ti-circle-check"},
            ].map(s=>(
              <div key={s.label} style={{background:"#fff",border:`1px solid ${C.border}`,
                borderRadius:12,padding:"14px 18px",display:"flex",alignItems:"center",gap:12,flex:1,
                boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
                <i className={s.icon} style={{fontSize:20,color:s.color}} />
                <div>
                  <div style={{fontSize:24,fontWeight:700,color:s.color,lineHeight:1,fontFamily:"Inter,sans-serif"}}>{s.val}</div>
                  <div style={{fontSize:11,color:C.text3,marginTop:2}}>{s.label}</div>
                </div>
              </div>
            ))}
          </div>

          {/* Tabs */}
          <div style={{display:"flex",gap:0,marginBottom:16,background:"#fff",borderRadius:9,
            border:`1px solid ${C.border}`,padding:4,width:"fit-content"}}>
            {["Active","Archive","Saved"].map((t,i)=>(
              <button key={t} style={{padding:"6px 20px",borderRadius:7,border:"none",
                background:i===0?"#F0F3F7":"transparent",
                fontSize:13,fontWeight:700,color:i===0?C.text1:C.text3}}>{t}</button>
            ))}
          </div>

          {/* App cards */}
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {APPS_DATA.map(app=>(
              <AppCard key={app.id} app={app} completed={completed&&app.missing>0}
                onComplete={handleStart} />
            ))}
          </div>
        </div>

        {/* ── Right Panel (AI) ── */}
        <div style={{width:420,flexShrink:0,display:"flex",flexDirection:"column",
          borderLeft:`1px solid ${C.border}`,background:"#fff",overflow:"hidden"}}>

          <ARSCard score={arsScore} />

          {/* Chat header */}
          <div style={{padding:"10px 16px",borderBottom:`1px solid ${C.border2}`,
            display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            <img src="assets/favicon.png" alt="" style={{width:20,height:20}} />
            <span style={{fontSize:13,fontWeight:700,color:C.text1}}>Bloom AI</span>
            <div style={{width:6,height:6,borderRadius:"50%",background:C.green}} />
            <span style={{fontSize:10,color:C.green,fontWeight:600}}>Online</span>
          </div>

          {/* Chat feed */}
          <div style={{flex:1,overflowY:"auto",padding:"16px 14px"}}>
            {!started && (
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",
                justifyContent:"center",height:"100%",gap:14,padding:"0 16px"}}>
                <div style={{width:56,height:56,borderRadius:"50%",background:"#F0FCFF",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  border:`2px solid ${C.cyan}44`}}>
                  <img src="assets/favicon.png" alt="" style={{width:32,height:32}} />
                </div>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:15,fontWeight:700,color:C.text1,marginBottom:6}}>
                    3 applications need info
                  </div>
                  <div style={{fontSize:12,color:C.text3,lineHeight:1.6}}>
                    Click <strong style={{color:C.orange}}>"Complete with AI"</strong> on any card, or the banner above, to start a quick conversation that fills all missing fields at once.
                  </div>
                </div>
              </div>
            )}
            {allMsgs.map(msg=>(
              <div key={msg._id} className="msg-in">
                <RenderMsg msg={msg} onTextSubmit={handleTextSubmit} />
              </div>
            ))}
            {typing && <Typing />}
            {!typing && !chipsLocked && curScript.chips && started && (
              <div className="msg-in">
                <Chips chips={curScript.chips} onChip={handleChip} disabled={chipsLocked} />
              </div>
            )}
            <div ref={endRef} style={{height:8}} />
          </div>

          {/* Input bar */}
          <div style={{flexShrink:0,borderTop:`1px solid ${C.border2}`,padding:"10px 14px",
            display:"flex",gap:8,alignItems:"center"}}>
            <div style={{flex:1,display:"flex",alignItems:"center",gap:8,
              background:"#F5F6F7",borderRadius:12,padding:"0 12px"}}>
              <input
                placeholder="Ask me anything or share info…"
                style={{flex:1,background:"transparent",border:"none",padding:"10px 0",
                  fontSize:12.5,color:C.text2}}
              />
              <i className="ti ti-paperclip" style={{fontSize:14,color:C.muted}} />
            </div>
            <button style={{width:38,height:38,borderRadius:10,background:C.brandMid,border:"none",
              display:"flex",alignItems:"center",justifyContent:"center"}}>
              <i className="ti ti-send" style={{fontSize:15,color:"#fff"}} />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
